<div class="h-fit flex flex-col items-center">
  <app-header text="SPONSORS"></app-header>

  <div class="flex flex-col gap-y-10 py-10">
    <div class="flex flex-col text-center gap-y-10">
      <h1 class="text-3xl">PREMIER</h1>
      <div class="flex flex-row gap-x-10 justify-center">
        <app-sponsor-card image="/majestic-logo-white.png" imageAlt="Majestic Logo" [imageWidth]="300" [imageHeight]="100" websiteHref="https://majestic.com/"></app-sponsor-card>
      </div>
    </div>
    <div class="flex flex-col text-center gap-y-10">
      <h1 class="text-3xl">MAJOR</h1>
      <div class="flex flex-col md:flex-row gap-x-10 justify-evenly items-center">
        <app-sponsor-card class="px-10 py-10" image="/domestic-and-general.png" imageAlt="Domestic & General Logo" [imageWidth]="200" [imageHeight]="100" websiteHref="https://www.domesticandgeneral.com/"></app-sponsor-card>
        <app-sponsor-card class="px-10 py-10" image="/Untold_Master_RGB_Cutaway_White.png" imageAlt="Untold Studios Logo" [imageWidth]="150" [imageHeight]="80" websiteHref="https://untoldstudios.tv/"></app-sponsor-card>
      </div>
    </div>
    <div class="fles flex-col text-center gap-y-10">
      <h1 class="text-3xl">SUPPORTING</h1>
      <div class="flex flex-col md:flex-row gap-x-10 justify-center items-center">
        <app-sponsor-card class="py-10 px-10" image="/CWG_Logo_Pink.webp" imageAlt="Code Wizards Logo" [imageWidth]="150" [imageHeight]="80" websiteHref="https://codewizards.io/"></app-sponsor-card>
        <app-sponsor-card class="py-10 px-10" image="/transoft-solutions.png" imageAlt="Transoft Solutions Logo" [imageWidth]="200" [imageHeight]="80" websiteHref="https://www.transoftsolutions.com/"></app-sponsor-card>
        <app-sponsor-card class="py-20 px-10" image="/College_of_Engineering_and_Physical_Sciences_White.webp" imageAlt="Aston University College of Physical Sciences Logo" [imageWidth]="200" [imageHeight]="150" websiteHref="https://www.aston.ac.uk/eps"></app-sponsor-card>
      </div>
    </div>
    <div class="fles flex-col text-center gap-y-10">
      <h1 class="text-3xl">PARTNERS</h1>
      <div class="flex flex-col md:flex-row gap-x-10 justify-center items-center">
        <app-sponsor-card class="py-10 px-10" image="/hackathons.png" imageAlt="Hackathons UK Logo" [imageWidth]="250" [imageHeight]="80" websiteHref="https://www.hackathons.org.uk/"></app-sponsor-card>
        <app-sponsor-card class="py-10 px-10" image="/mlh-logo-white.png" imageAlt="Mega League Hacking Logo" [imageWidth]="200" [imageHeight]="80" websiteHref="https://mlh.io/"></app-sponsor-card>
      </div>
    </div>
  </div>
</div>
